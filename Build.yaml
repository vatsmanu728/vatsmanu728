name: Update profile card

on:
  schedule:
    - cron: "17 4 * * *"   # once a day (UTC 04:17 -- off the hour to dodge GH's peak-time queue)
  workflow_dispatch: {}     # lets you trigger it manually from the Actions tab
  push:
    branches: [main]
    paths:
      - "MyProfile.py"
      - "ascii_art.txt"

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Generate SVGs
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python MyProfile.py

      - name: Commit changes if anything moved
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg cache.txt repository_archive.txt
          git diff --quiet --cached || git commit -m "Update profile card"
          git push
